name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: テスト
        run: python tests/run_all.py

      # 手で作った架空の vault で、コマンドとして動くこと(検出ありなので終了コード 1)を見る
      - name: コマンドとして回す
        run: |
          set +e
          python -m vaultvet tests/fixtures/vault --json > /dev/null
          test $? -eq 1
